<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriCI - Catalogue</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f4;
            color: #1f2937;
        }

        header {
            background-color: #166534;
            color: white;
            padding: 24px;
            text-align: center;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        #catalogue {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }

        .produit {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        .produit h2 {
            margin-top: 0;
            color: #166534;
        }

        .prix {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .stock-bas {
            color: #b91c1c;
            font-weight: bold;
        }

        .erreur {
            color: #b91c1c;
            background-color: #fee2e2;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
<header>
    <h1>NutriCI</h1>
    <p>Catalogue de compléments alimentaires</p>
</header>

<main>
    <h2>Nos produits</h2>
    <div id="catalogue">
        <p>Chargement du catalogue...</p>
    </div>
</main>

<script>
    async function chargerProduits() {
        const catalogue = document.getElementById("catalogue");

        try {
            const reponse = await fetch("/api/produits");

            if (!reponse.ok) {
                throw new Error("Erreur HTTP : " + reponse.status);
            }

            const produits = await reponse.json();

            if (produits.length === 0) {
                catalogue.innerHTML = "<p>Aucun produit disponible.</p>";
                return;
            }

            catalogue.innerHTML = produits.map(produit => `
                <article class="produit">
                    <h2>${produit.nom}</h2>
                    <p>Référence : ${produit.reference}</p>
                    <p class="prix">${produit.prixUnitaire.toLocaleString("fr-FR")} FCFA</p>
                    <p>Stock disponible : ${produit.qteStock}</p>
                    ${produit.stockBas
                ? '<p class="stock-bas">Stock faible</p>'
                : '<p>Produit disponible</p>'}
                </article>
            `).join("");
        } catch (erreur) {
            catalogue.innerHTML =
                `<p class="erreur">Impossible de charger le catalogue : ${erreur.message}</p>`;
        }
    }

    chargerProduits();
</script>
</body>
</html>
